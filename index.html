<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Faune Familial - IA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1, h2 { margin-top: 0; color: #2c3e50; text-align: center; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #eef2f5; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    .xp-bar { background: #ddd; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
    .xp-fill { background: #4CAF50; height: 100%; width: 0%; transition: width 0.3s; }
    label { display: block; margin-top: 15px; font-size: 14px; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #27ae60; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; transition: background 0.3s; }
    button:disabled { background: #95a5a6; cursor: not-allowed; }
    button.analyze-btn { background: #3498db; }
    
    #preview { max-width: 100%; height: auto; display: none; border-radius: 8px; margin-top: 10px; }
    #identification-results { display: none; margin-top: 15px; background: #eef2f5; padding: 15px; border-radius: 8px; }
    #suggestion-list { margin-top: 10px; }
    .suggestion-item { background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 2px solid #e0e0e0; transition: all 0.2s; }
    .suggestion-item:active { border-color: #27ae60; background: #e8f8f0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
    .animal-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); text-align: center; padding-bottom: 10px; }
    .animal-card img { width: 100%; height: 110px; object-fit: cover; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; margin-top: 5px; }
    .Commun { background: #95a5a6; }
    .Peu-commun { background: #3498db; }
    .Rare { background: #9b59b6; }
    .Très-rare { background: #e67e22; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🦅 Pokédex IA</h1>
    <div class="status-bar">
      <span>Niveau <span id="level">1</span> (<span id="title">Débutant</span>)</span>
      <span><span id="xp">0</span> XP</span>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
  </div>

  <div class="card">
    <h2>📸 Analyser une photo</h2>
    <input type="file" id="photo" accept="image/*" capture="environment" required>
    <img id="preview" alt="Aperçu">
    <button type="button" id="analyze-btn" class="analyze-btn" style="display:none;">Analyser avec l'IA</button>

    <div id="identification-results">
      <h3>IA : Quelles espèces ?</h3>
      <p style="font-size:13px; color:#666;">Cliquez sur l'animal identifié :</p>
      <div id="suggestion-list"></div>
      <p id="loading-ia" style="display:none; text-align:center;">🔍 Recherche de l'animal...</p>
    </div>

    <form id="capture-form" style="display:none; border-top: 1px solid #eee; margin-top: 20px;">
      <label for="name">Nom retenu</label>
      <input type="text" id="name" required>

      <label for="rarity">Rareté de l'espèce</label>
      <select id="rarity">
        <option value="50">Commun (50 XP)</option>
        <option value="150">Peu commun (150 XP)</option>
        <option value="350">Rare (350 XP)</option>
        <option value="700">Très rare (700 XP)</option>
      </select>

      <button type="submit" id="submit-btn">Ajouter au Pokédex</button>
    </form>
  </div>

  <div class="card">
    <h2>📖 Votre Collection</h2>
    <div class="grid" id="collection"></div>
  </div>

  <script>
    const levels = [
      { xp: 0, level: 1, title: 'Débutant' },
      { xp: 150, level: 2, title: 'Observateur' },
      { xp: 500, level: 3, title: 'Explorateur' },
      { xp: 1200, level: 4, title: 'Naturaliste' },
      { xp: 2500, level: 5, title: 'Pisteur' },
      { xp: 4500, level: 6, title: 'Expert Faune' },
      { xp: 7500, level: 7, title: 'Maître Nature' },
      { xp: 12000, level: 8, title: 'Légende' }
    ];

    let state = JSON.parse(localStorage.getItem('pokedex')) || { xp: 0, animals: [] };

    function updateUI() {
      let currentLevel = levels[0];
      let nextLevel = levels[1];
      for (let i = levels.length - 1; i >= 0; i--) {
        if (state.xp >= levels[i].xp) { currentLevel = levels[i]; nextLevel = levels[i + 1] || levels[i]; break; }
      }
      document.getElementById('xp').textContent = state.xp;
      document.getElementById('level').textContent = currentLevel.level;
      document.getElementById('title').textContent = currentLevel.title;
      let progress = 100;
      if (nextLevel !== currentLevel) {
        progress = Math.min(((state.xp - currentLevel.xp) / (nextLevel.xp - currentLevel.xp)) * 100, 100);
      }
      document.getElementById('xp-fill').style.width = progress + '%';

      const container = document.getElementById('collection');
      container.innerHTML = '';
      state.animals.forEach(item => {
        const rarityClass = item.rarityText.replace(/\s+/g, '-');
        container.innerHTML += `
          <div class="animal-card">
            <img src="${item.img}" alt="${item.name}">
            <h4 style="margin: 5px 0 2px 0;">${item.name}</h4>
            <span class="badge ${rarityClass}">${item.rarityText}</span>
          </div>
        `;
      });
      localStorage.setItem('pokedex', JSON.stringify(state));
    }

    const photoInput = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyze-btn');
    let currentPhotoBase64 = null;
    let currentFile = null;

    photoInput.addEventListener('change', function(e) {
      currentFile = e.target.files[0];
      if (currentFile) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          preview.src = evt.target.result;
          preview.style.display = 'block';
          analyzeBtn.style.display = 'block';
          currentPhotoBase64 = evt.target.result;
          document.getElementById('identification-results').style.display = 'none';
          document.getElementById('capture-form').style.display = 'none';
        };
        reader.readAsDataURL(currentFile);
      }
    });

    // Envoi réel à l'API iNaturalist v1
    analyzeBtn.addEventListener('click', async function() {
      if (!currentFile) return;
      
      const resultsDiv = document.getElementById('identification-results');
      const loading = document.getElementById('loading-ia');
      const list = document.getElementById('suggestion-list');
      
      resultsDiv.style.display = 'block';
      loading.style.display = 'block';
      list.innerHTML = '';
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyse en cours...';

      const formData = new FormData();
      formData.append('image', currentFile);

      try {
        const response = await fetch('https://api.inaturalist.org/v1/computervision/score', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        loading.style.display = 'none';

        if (data.results && data.results.length > 0) {
          data.results.slice(0, 4).forEach(res => {
            const species = res.taxon;
            const commonName = species.preferred_common_name || species.name;
            const sciName = species.name;
            const photoUrl = species.default_photo ? species.default_photo.square_url : '';

            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.innerHTML = `
              <div style="display:flex; align-items:center;">
                ${photoUrl ? `<img src="${photoUrl}" style="width:40px;height:40px;border-radius:50%;margin-right:10px;object-fit:cover;">` : ''}
                <div>
                  <div style="font-weight:bold;">${commonName}</div>
                  <div style="font-size:12px; font-style:italic; color:#666;">${sciName}</div>
                </div>
              </div>
            `;
            item.onclick = function() {
              selectSpecies(commonName);
            };
            list.appendChild(item);
          });
        } else {
          list.innerHTML = '<p>Aucune espèce reconnue. Vous pouvez écrire le nom manuellement.</p>';
          selectSpecies('');
        }
      } catch (error) {
        console.error('Erreur API:', error);
        loading.style.display = 'none';
        list.innerHTML = '<p>Recherche indisponible. Vous pouvez saisir le nom à la main.</p>';
        selectSpecies('');
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyser avec l\'IA';
      }
    });

    function selectSpecies(name) {
      document.getElementById('name').value = name;
      document.getElementById('capture-form').style.display = 'block';
    }

    document.getElementById('capture-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const raritySelect = document.getElementById('rarity');
      const xpGained = parseInt(raritySelect.value);
      const rarityText = raritySelect.options[raritySelect.selectedIndex].text.split(' ')[0];

      const isFirstDiscovery = !state.animals.some(a => a.name.toLowerCase() === name.toLowerCase());

      state.xp += xpGained + (isFirstDiscovery ? 50 : 0);
      state.animals.unshift({
        name: name,
        img: currentPhotoBase64,
        rarityText: rarityText
      });
      
      updateUI();
      document.getElementById('capture-form').reset();
      document.getElementById('preview').style.display = 'none';
      document.getElementById('analyze-btn').style.display = 'none';
      document.getElementById('identification-results').style.display = 'none';
      photoInput.value = '';
    });

    updateUI();
  </script>
</body>
</html>
